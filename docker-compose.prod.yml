# Production compose for Sentinel AI.
#
# Differences from docker-compose.yml (dev):
#   - no source bind-mounts, no uvicorn --reload (runs the built image)
#   - uvicorn runs multiple workers
#   - Postgres/Redis are NOT published to the host (reachable only on the
#     internal compose network)
#   - Redis requires a password (requirepass)
#   - Postgres/Redis passwords are REQUIRED (no insecure defaults) — compose
#     refuses to start if they're unset
#   - per-service mem_limit / cpus sized for a small VM (~2 GB, e.g. B1ms)
#   - restart: unless-stopped on every service
#
# Usage:
#   set POSTGRES_PASSWORD and REDIS_PASSWORD (and the app secrets) in .env, then:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  # ── PostgreSQL Database (with pgvector) ── internal-only
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env for prod}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_ai}
    # No host port mapping — only services on the compose network can reach it.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 640m
    cpus: 0.6

  # ── Redis (broker + cache) ── internal-only, password-protected
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env for prod}", "--save", "60", "1"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.3

  # ── Backend API (FastAPI) ── runs migrations once, then uvicorn workers
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No bind mount, no --reload. Migrations run here (single process) before serving.
    command: sh -c "python scripts/db_migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    restart: unless-stopped
    mem_limit: 640m
    cpus: 0.7

  # ── Celery Worker (Async Tasks) ── does NOT run migrations (avoids DDL races)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-celery
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped
    mem_limit: 448m
    cpus: 0.5

  # ── Next.js Dashboard (Frontend) ──
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    container_name: sentinel-dashboard
    ports:
      - "3000:3000"
    env_file:
      - ./dashboard/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.4

volumes:
  postgres_data:
  redis_data:
