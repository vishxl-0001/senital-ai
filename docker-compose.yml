version: '3.8'

services:
  # ── PostgreSQL Database (with pgvector) ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (Cache + Queue Broker) ──
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API (FastAPI) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:sentinel_dev@postgres:5432/sentinel_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "python scripts/db_migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ── Celery Worker (Async Tasks) ──
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-celery
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:sentinel_dev@postgres:5432/sentinel_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4

  # ── Next.js Dashboard (Frontend) ──
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    container_name: sentinel-dashboard
    ports:
      - "3000:3000"
    env_file:
      - ./dashboard/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
